# Perfil de desarrollo: arranca sin configurar nada (H2 en memoria)
spring.datasource.url=${DATASOURCE_URL:jdbc:h2:mem:devdb}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATASOURCE_USER:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
logging.level.com.ejemplo=DEBUG

# Solo si el proyecto trae autenticación con JWT (ej.: Unidad 9). Descomentar en ese caso:
# app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-no-usar-en-produccion}

# Actuator: en desarrollo se exponen todos los endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
