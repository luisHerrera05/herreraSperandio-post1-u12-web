# Perfil de producción: los valores reales llegan por variables de entorno
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${DATASOURCE_USER:appuser}
spring.datasource.password=${DATASOURCE_PASSWORD:}
# validate exige que las tablas ya existan. En el PRIMER despliegue con una BD vacía
# se define DDL_AUTO=update en el panel de la plataforma (luego se puede quitar).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.ejemplo=INFO

# Solo si el proyecto trae autenticación con JWT. Sin valor por defecto: nunca debe haber un secreto usable.
# app.jwt.secret=${JWT_SECRET:}

# Actuator: en producción solo health e info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
