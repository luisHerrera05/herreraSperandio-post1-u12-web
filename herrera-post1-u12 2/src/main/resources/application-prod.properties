# Perfil de producción: sin credenciales usables por defecto.
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${DATASOURCE_USER:appuser}
spring.datasource.password=${DATASOURCE_PASSWORD:}
# validate exige que las tablas ya existan. En el PRIMER despliegue sobre una BD vacía
# defina DDL_AUTO=update en la plataforma y luego quítela.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.ejemplo=INFO

app.jwt.secret=${JWT_SECRET:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
